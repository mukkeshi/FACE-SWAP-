<!DOCTYPE html>
<html>
<head>
    <title>Deepfake Detector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; display: inline-block; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { margin: 20px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔍 Deepfake Face Detector</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" required><br>
            <button type="submit">Check Image</button>
        </form>

        {% if result %}
            <hr>
            <img src="{{ image_path }}" width="200"><br>
            <h3>Result: {{ result }}</h3>
            <p>Confidence: {{ confidence }}%</p>
        {% endif %}
    </div>
</body>
</html>
